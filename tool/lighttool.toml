[tool]
id = "com.christianlacerda.habits"
label = "Habits"
versionCode = 3
versionName = "1.0.0"
permissions = []
capabilities = []
# No orientation lock. "portrait" letterboxes the tool on the LP3's near-square
# 1080x1240 display — Android applies compatibility letterboxing to fixed-orientation
# activities there, leaving bars down both sides. The device doesn't rotate anyway.
# scripts/run-emulator.sh switches this to the emulator package for its own build.
serverPackage = "com.lightos"
